name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Build Mbed TLS 3.6 for CI
        run: |
          git clone --depth 1 --recurse-submodules --branch v3.6.2 https://github.com/Mbed-TLS/mbedtls.git /tmp/mbedtls
          cmake -S /tmp/mbedtls -B /tmp/mbedtls/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/mbedtls/build -j
          sudo cmake --install /tmp/mbedtls/build
      - name: Check formatting
        run: make format-check
      - name: Build
        run: make build BUILD_DIR=build
      - name: Test
        run: ctest --test-dir build --output-on-failure
